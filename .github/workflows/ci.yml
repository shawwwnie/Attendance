name: CareFlow verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Domain and PostgreSQL integration tests
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build disposable PostgreSQL demo server
        working-directory: backend
        run: ./mvnw -B -ntp test-compile dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Start API
        working-directory: backend
        run: java -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" dev.careflow.LocalDemoServer > /tmp/careflow-api.log 2>&1 &
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend
        working-directory: frontend
        run: npm run dev > /tmp/careflow-web.log 2>&1 &
      - name: Wait for both services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health && curl -fsS http://localhost:5173; then exit 0; fi
            sleep 1
          done
          cat /tmp/careflow-api.log /tmp/careflow-web.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: |
            frontend/playwright-report
            frontend/test-results
