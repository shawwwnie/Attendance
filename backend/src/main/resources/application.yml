spring:
  application:
    name: careflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careflow}
    username: ${DB_USERNAME:careflow}
    password: ${DB_PASSWORD:careflow-local-demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
careflow:
  demo-enabled: false
