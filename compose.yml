services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow-local-demo}
    volumes:
      - careflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U careflow -d careflow']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/careflow
      DB_USERNAME: careflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-careflow-local-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-careflow-demo}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:4173:80'
    depends_on:
      - api
volumes:
  careflow-db:
